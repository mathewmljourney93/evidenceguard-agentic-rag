# Alembic configuration for running migrations from the source checkout:
#
#   uv run --locked alembic upgrade head        # needs EG_DATABASE_URL
#   uv run --locked alembic upgrade head --sql  # offline SQL; no database needed
#
# The migration scripts are packaged in evidenceguard_persistence, so an installed wheel can
# use evidenceguard_persistence.migration_config.alembic_config() instead of this file.
# Never put database URLs or credentials here; they come from EG_DATABASE_URL.

[alembic]
script_location = evidenceguard_persistence:migrations
path_separator = os
