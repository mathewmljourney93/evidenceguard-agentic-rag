[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidenceguard"
version = "0.1.0.dev0"
description = "Auditable multi-agent RAG for vendor risk review (pre-alpha)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
eg-api = "evidenceguard_api.__main__:main"
eg-admin = "evidenceguard_api.admin:main"
eg-worker = "evidenceguard_worker.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Dependency-age policy: new dependencies resolve to releases published at least two weeks
# before they were added (ADR-0004). The cutoff applies only to the packages listed here.
[tool.uv]
exclude-newer-package = { sqlalchemy = "2026-09-28T00:00:00Z", alembic = "2026-09-28T00:00:00Z", psycopg = "2026-09-28T00:00:00Z", psycopg-binary = "2026-09-28T00:00:00Z", pydantic-settings = "2026-09-28T00:00:00Z", mako = "2026-09-28T00:00:00Z", markupsafe = "2026-09-28T00:00:00Z", greenlet = "2026-09-28T00:00:00Z", python-dotenv = "2026-09-28T00:00:00Z", tzdata = "2026-09-28T00:00:00Z", python-multipart = "2026-10-01T00:00:00Z" }

# One distribution, nested layout: each package lives under its approved
# directory and is installed at the top level of the wheel (see ADR-0001).
[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/evidenceguard_api",
    "apps/worker/evidenceguard_worker",
    "packages/domain/evidenceguard_domain",
    "packages/observability/evidenceguard_observability",
    "packages/persistence/evidenceguard_persistence",
    "packages/retrieval/evidenceguard_retrieval",
]

[tool.hatch.build.targets.sdist]
include = [
    "/apps/api/evidenceguard_api",
    "/apps/worker/evidenceguard_worker",
    "/packages/domain/evidenceguard_domain",
    "/packages/observability/evidenceguard_observability",
    "/packages/persistence/evidenceguard_persistence",
    "/packages/retrieval/evidenceguard_retrieval",
    "/alembic.ini",
    "/tests",
    "/docs/decisions",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "evidenceguard_api",
    "evidenceguard_domain",
    "evidenceguard_observability",
    "evidenceguard_persistence",
    "evidenceguard_retrieval",
    "evidenceguard_worker",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "apps/api/evidenceguard_api",
    "packages/domain/evidenceguard_domain",
    "packages/observability/evidenceguard_observability",
    "packages/persistence/evidenceguard_persistence",
    "packages/retrieval/evidenceguard_retrieval",
    "apps/worker/evidenceguard_worker",
    "tests",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = [
    "integration: needs EG_TEST_DATABASE_URL, a disposable PostgreSQL test database (see ADR-0004)",
]
