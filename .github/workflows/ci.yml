name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type-check
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

      - name: Build distribution
        run: uv build

      - name: Install the wheel in a clean environment and import it
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/wheel-check" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/wheel-check" dist/evidenceguard-*.whl
          if [ -x "${RUNNER_TEMP}/wheel-check/Scripts/python.exe" ]; then
            bin="${RUNNER_TEMP}/wheel-check/Scripts"
          else
            bin="${RUNNER_TEMP}/wheel-check/bin"
          fi
          cd "${RUNNER_TEMP}"
          "${bin}/python" -I -c "import evidenceguard_api, evidenceguard_domain; from evidenceguard_api.app import create_app; create_app(); print(evidenceguard_api.__file__); assert 'site-packages' in evidenceguard_api.__file__"
          "${bin}/eg-api" --help
          "${bin}/eg-worker" --help
          "${bin}/python" -I -c "from evidenceguard_worker.handlers import production_registry; assert production_registry().kinds == frozenset({'ingest_revision', 'index_revision'}); print('production registry: ingest_revision, index_revision')"
          # M4c (ADR-0015): run the offline embedder and canonical storage from the installed
          # wheel and import the indexing modules. No database is contacted; this check does
          # not establish database indexing (the container smoke does).
          "${bin}/python" -I - <<'PY'
          import uuid
          import evidenceguard_domain.embedding_storage as storage
          import evidenceguard_persistence.indexing as index_store
          import evidenceguard_retrieval.embeddings as provider
          import evidenceguard_worker.indexing as handler
          from evidenceguard_worker.handlers import production_registry
          for module in (storage, index_store, provider, handler):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          fingerprint = "ad53bb3be5d8c50909b9f984294703d572e8f1844a43c5223ef86cd4a1162376"
          assert provider.HASH_IDENTITY.fingerprint == fingerprint
          batch = provider.embed_validated(provider.HashingEmbedder(), ("wheel check", "!!!"), "document")
          chunks = [(uuid.UUID(int=1), "a" * 64), (uuid.UUID(int=2), "b" * 64)]
          rows = storage.stored_embeddings(batch, identity=provider.HASH_IDENTITY, chunks=chunks)
          assert not rows[0].vector.is_zero and rows[1].vector.is_zero
          assert len(rows[0].vector.wire_bytes()) == 4100
          assert tuple(handler.SUPPORTED_PROVIDERS) == (fingerprint,)
          assert production_registry().kinds == frozenset({"ingest_revision", "index_revision"})
          print("offline embedding, canonical storage and indexing modules ran from the installed wheel")
          PY
          # M4d (ADR-0016): import the retrieval modules from the installed wheel and run fusion
          # on a fixed fixture with a pinned result. No database or provider is contacted; this
          # check does not establish database retrieval (the PostgreSQL integration job does).
          "${bin}/python" -I - <<'PY'
          import uuid
          from fractions import Fraction
          import evidenceguard_domain.retrieval as contracts
          import evidenceguard_persistence.retrieval as store
          import evidenceguard_worker.retrieval as orchestration
          for module in (contracts, store, orchestration):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          one, two, three = (uuid.UUID(int=n) for n in (1, 2, 3))
          lists = (
              contracts.ChannelList(0, "lexical", ((one, 2.0), (two, 1.0))),
              contracts.ChannelList(0, "vector", ((two, 0.1), (three, 0.2))),
          )
          fused = contracts.fuse(lists, query_count=1, vector_skipped=(), k=8)
          expected = [(two, 1, Fraction(123, 3782)), (one, 2, Fraction(1, 61)), (three, 3, Fraction(1, 62))]
          assert [(c.chunk_id, c.fused_rank, c.fused_score) for c in fused] == expected
          print("retrieval modules imported and fusion ran from the installed wheel")
          PY
          # M4e (ADR-0017): import the pure evaluation modules from the installed wheel and
          # compute the specified 2/3 Recall example. The corpus is not in the wheel and no
          # database is contacted; this check does not establish evaluation (the PostgreSQL
          # integration job does).
          "${bin}/python" -I - <<'PY'
          import uuid
          from fractions import Fraction
          import evidenceguard_retrieval.evaluation.anchors as anchors
          import evidenceguard_retrieval.evaluation.corpus as corpus
          import evidenceguard_retrieval.evaluation.recall as recall
          for module in (corpus, anchors, recall):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          a, b, c, x, y, z = (uuid.UUID(int=n) for n in range(1, 7))
          assert recall.recall_at_k([a, x, b, y, z], frozenset({a, b, c}), 5) == Fraction(2, 3)
          print("evaluation modules imported and Recall@5 = 2/3 computed from the installed wheel")
          PY
          "${bin}/python" -I -c "import io; from alembic import command; from evidenceguard_persistence.migration_config import alembic_config; buf = io.StringIO(); command.upgrade(alembic_config(output_buffer=buf), 'head', sql=True); assert 'CREATE TABLE api_keys' in buf.getvalue(); print('offline migration SQL rendered from the installed wheel')"

  integration:
    # PostgreSQL integration tests. Service containers run only on Linux runners, so this job
    # is Ubuntu-only; the verify job keeps the database-independent checks on both systems.
    name: integration (ubuntu-24.04, PostgreSQL 17 + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          # Disposable credentials for this throwaway CI container only.
          POSTGRES_USER: evidenceguard
          POSTGRES_PASSWORD: evidenceguard-ci-only
          POSTGRES_DB: evidenceguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceguard -d evidenceguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EG_TEST_DATABASE_URL: postgresql+psycopg://evidenceguard:evidenceguard-ci-only@localhost:5432/evidenceguard_test
      EG_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Confirm the database is ready
        run: docker exec "${{ job.services.postgres.id }}" pg_isready -U evidenceguard -d evidenceguard_test

      - name: Run integration tests
        run: uv run --locked pytest -m integration

  container:
    # M3f (ADR-0012): image build, effective build-context check, image checks and a Compose smoke
    # test. Linux containers need an Ubuntu runner. Development stack only; nothing is published.
    name: container (ubuntu-24.04, image build and Compose smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # One selection for every step: the same Compose file, project name and image tag.
      EG_COMPOSE_PROJECT: eg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      EG_IMAGE: evidenceguard:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the rendered Compose configuration
        run: python3 infra/ci/container_ci.py config

      - name: Verify the effective build context
        run: python3 infra/ci/container_ci.py context

      - name: Build the application image
        run: |
          set -euo pipefail
          timeout 900 docker compose -f docker-compose.yml -p "$EG_COMPOSE_PROJECT" build api
          echo "EG_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$EG_IMAGE")" >> "$GITHUB_ENV"

      - name: Check the image
        run: python3 infra/ci/container_ci.py image

      - name: Compose smoke test
        run: python3 infra/ci/container_ci.py smoke

      - name: Clean up this run's Compose project and image
        # Runs whatever the outcome. Losing the runner or a hard cancellation can still prevent it.
        if: always()
        run: python3 infra/ci/container_ci.py cleanup
