name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type-check
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

      - name: Build distribution
        run: uv build

      - name: Install the wheel in a clean environment and import it
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/wheel-check" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/wheel-check" dist/evidenceguard-*.whl
          if [ -x "${RUNNER_TEMP}/wheel-check/Scripts/python.exe" ]; then
            bin="${RUNNER_TEMP}/wheel-check/Scripts"
          else
            bin="${RUNNER_TEMP}/wheel-check/bin"
          fi
          cd "${RUNNER_TEMP}"
          "${bin}/python" -I -c "import evidenceguard_api, evidenceguard_domain; from evidenceguard_api.app import create_app; create_app(); print(evidenceguard_api.__file__); assert 'site-packages' in evidenceguard_api.__file__"
          "${bin}/eg-api" --help
          "${bin}/eg-worker" --help
          "${bin}/python" -I -c "from evidenceguard_worker.handlers import production_registry; assert production_registry().kinds == frozenset({'ingest_revision', 'index_revision'}); print('production registry: ingest_revision, index_revision')"
          # M4c (ADR-0015): run the offline embedder and canonical storage from the installed
          # wheel and import the indexing modules. No database is contacted; this check does
          # not establish database indexing (the container smoke does).
          "${bin}/python" -I - <<'PY'
          import uuid
          import evidenceguard_domain.embedding_storage as storage
          import evidenceguard_persistence.indexing as index_store
          import evidenceguard_retrieval.embeddings as provider
          import evidenceguard_worker.indexing as handler
          from evidenceguard_worker.handlers import production_registry
          for module in (storage, index_store, provider, handler):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          fingerprint = "ad53bb3be5d8c50909b9f984294703d572e8f1844a43c5223ef86cd4a1162376"
          assert provider.HASH_IDENTITY.fingerprint == fingerprint
          batch = provider.embed_validated(provider.HashingEmbedder(), ("wheel check", "!!!"), "document")
          chunks = [(uuid.UUID(int=1), "a" * 64), (uuid.UUID(int=2), "b" * 64)]
          rows = storage.stored_embeddings(batch, identity=provider.HASH_IDENTITY, chunks=chunks)
          assert not rows[0].vector.is_zero and rows[1].vector.is_zero
          assert len(rows[0].vector.wire_bytes()) == 4100
          assert tuple(handler.SUPPORTED_PROVIDERS) == (fingerprint,)
          assert production_registry().kinds == frozenset({"ingest_revision", "index_revision"})
          print("offline embedding, canonical storage and indexing modules ran from the installed wheel")
          PY
          # M4d (ADR-0016): import the retrieval modules from the installed wheel and run fusion
          # on a fixed fixture with a pinned result. No database or provider is contacted; this
          # check does not establish database retrieval (the PostgreSQL integration job does).
          "${bin}/python" -I - <<'PY'
          import uuid
          from fractions import Fraction
          import evidenceguard_domain.retrieval as contracts
          import evidenceguard_persistence.retrieval as store
          import evidenceguard_worker.retrieval as orchestration
          for module in (contracts, store, orchestration):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          one, two, three = (uuid.UUID(int=n) for n in (1, 2, 3))
          lists = (
              contracts.ChannelList(0, "lexical", ((one, 2.0), (two, 1.0))),
              contracts.ChannelList(0, "vector", ((two, 0.1), (three, 0.2))),
          )
          fused = contracts.fuse(lists, query_count=1, vector_skipped=(), k=8)
          expected = [(two, 1, Fraction(123, 3782)), (one, 2, Fraction(1, 61)), (three, 3, Fraction(1, 62))]
          assert [(c.chunk_id, c.fused_rank, c.fused_score) for c in fused] == expected
          print("retrieval modules imported and fusion ran from the installed wheel")
          PY
          # M4e (ADR-0017): import the pure evaluation modules from the installed wheel and
          # compute the specified 2/3 Recall example. The corpus is not in the wheel and no
          # database is contacted; this check does not establish evaluation (the PostgreSQL
          # integration job does).
          "${bin}/python" -I - <<'PY'
          import uuid
          from fractions import Fraction
          import evidenceguard_retrieval.evaluation.anchors as anchors
          import evidenceguard_retrieval.evaluation.corpus as corpus
          import evidenceguard_retrieval.evaluation.recall as recall
          for module in (corpus, anchors, recall):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          a, b, c, x, y, z = (uuid.UUID(int=n) for n in range(1, 7))
          assert recall.recall_at_k([a, x, b, y, z], frozenset({a, b, c}), 5) == Fraction(2, 3)
          print("evaluation modules imported and Recall@5 = 2/3 computed from the installed wheel")
          PY
          # M4f (ADR-0018): import the Voyage adapter and HTTPS transport from the installed wheel
          # and run the adapter with an in-memory fake transport and one canned response. No
          # network, key or database is used; this check does not establish live Voyage
          # compatibility, and production providers stay offline-only.
          "${bin}/python" -I - <<'PY'
          import json
          import evidenceguard_retrieval.voyage as voyage
          import evidenceguard_worker.voyage_http as transport
          from evidenceguard_retrieval.embeddings import HASH_IDENTITY
          from evidenceguard_worker.indexing import SUPPORTED_PROVIDERS
          for module in (voyage, transport):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          fingerprint = "827fb43a08091171e8eea7b14f6943506646aff6e4dafe7e6fd47cca643cc109"
          assert voyage.VOYAGE_IDENTITY.fingerprint == fingerprint
          vector = [0.0] * 1024
          vector[0] = 1.0
          row = {"object": "embedding", "embedding": vector, "index": 0}
          document = {"object": "list", "data": [row], "model": "voyage-4-lite", "usage": {"total_tokens": 2}}
          class FakeTransport:
              def post(self, request):
                  assert json.loads(request)["model"] == "voyage-4-lite"
                  return voyage.VoyageResponse(200, json.dumps(document).encode())
          batch = voyage.VoyageEmbedder(FakeTransport()).embed(("wheel check",), "document")
          assert batch.identity == voyage.VOYAGE_IDENTITY and batch.vectors[0][0] == 1.0
          assert batch.usage.input_tokens == 2
          assert tuple(SUPPORTED_PROVIDERS) == (HASH_IDENTITY.fingerprint,)
          print("Voyage adapter validated a mocked response from the installed wheel")
          PY
          # M5a (ADR-0019): import the model-call contracts, the call boundary and the scripted
          # fake from the installed wheel and classify one scripted response. No network,
          # provider, key or database is used; the fake is a contract fixture, not a model.
          "${bin}/python" -I - <<'PY'
          import json
          import evidenceguard_agents.providers as providers
          import evidenceguard_agents.scripted as scripted
          import evidenceguard_domain.agent_outputs as outputs
          import evidenceguard_domain.model_calls as calls
          for module in (providers, scripted, outputs, calls):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          prompt = calls.PromptRef(prompt_id="verifier", version=1, sha256="1" * 64)
          request = calls.StructuredRequest(purpose=calls.ModelPurpose.VERIFIER, prompt=prompt, model_id=scripted.FAKE_MODEL_ID, question_id="RET-01", system_text="system", user_text="user", max_output_tokens=2048)
          assert request.request_sha256 == "20dcc59a564e16ff0069090555c0d14a4fbd5981beaa674f53c27002d64faf3d"
          document = {"verdict": "supported", "claims": [{"text": "c", "citations": [{"chunk_id": "00000000-0000-0000-0000-000000000001", "quote": "q"}]}], "rationale": "r"}
          fake = scripted.ScriptedFakeProvider(scripts={("verifier", "RET-01"): (scripted.Respond(json.dumps(document)), scripted.Refuse())})
          result = providers.call_validated(fake, request, clock=iter((1.0, 1.5)).__next__)
          assert result.outcome is calls.CallOutcome.COMPLETED and result.latency_ms == 500
          assert type(result.output) is outputs.VerifierOutput and result.output.verdict.value == "supported"
          assert type(result.output.claims) is tuple and result.output.claims[0].citations[0].quote == "q"
          assert providers.call_validated(fake, request).outcome is calls.CallOutcome.REFUSAL
          assert providers.call_validated(fake, request).outcome is calls.CallOutcome.PROVIDER_FAILED
          print("model-call contracts classified a scripted fake response from the installed wheel")
          PY
          # M5b (ADR-0020): import the provenance module from the installed wheel, match one quote
          # across a line break with exact original offsets and derive a status. No provider,
          # network or database is used; this is a contract check, not a semantic judgment.
          "${bin}/python" -I - <<'PY'
          import hashlib
          import uuid
          import evidenceguard_domain.provenance as provenance
          from evidenceguard_domain.evidence import Authenticity, Citation, EvidenceStatus, SourceType, Verdict
          from evidenceguard_domain.retrieval import ChunkEvidence, SourceSpan
          assert "site-packages" in (provenance.__file__ or ""), provenance.__name__
          text = "Customer data is encrypted" + chr(10) + "  at rest."
          span = SourceSpan(5, 6, 200, 200 + len(text))
          evidence = ChunkEvidence(uuid.UUID(int=1), text, hashlib.sha256(text.encode()).hexdigest(), 0, ("Encryption",), False, span, None, "security-overview", "Security Overview", 1, None, None, SourceType.VENDOR_STATEMENT, Authenticity.NOT_ESTABLISHED)
          match = provenance.match_quote(evidence, "encrypted at rest")
          original = "encrypted" + chr(10) + "  at rest"
          assert (match.kind, match.text_start, match.text_end) == (provenance.QuoteSpanKind.BODY, 17, 36)
          assert (match.source_char_start, match.source_char_end, match.quote, match.occurrences) == (217, 236, original, 1)
          assert provenance.match_quote(evidence, "decrypted at rest") is provenance.RejectionReason.QUOTE_NOT_FOUND
          citation = Citation(tenant_id=uuid.UUID(int=7), document_revision_id=uuid.UUID(int=8), chunk_id=uuid.UUID(int=1), source_type=SourceType.VENDOR_STATEMENT, quote=match.quote)
          assert citation.quote == original
          assert provenance.derive_status(Verdict.SUPPORTED, (citation,)) is EvidenceStatus.VENDOR_CLAIM
          assert provenance.derive_status(Verdict.CONTRADICTED, (citation,)) is None
          print("provenance matched a quote and derived a status from the installed wheel")
          PY
          # M5c (ADR-0021): load the packaged template and prompts through the pinned loaders,
          # plan, and assemble one Verifier request from a fixed evidence fixture; its digests
          # are pinned independently. No provider, network or database is used.
          "${bin}/python" -I - <<'PY'
          import hashlib
          import uuid
          from datetime import UTC, datetime
          from fractions import Fraction
          from importlib.resources import files
          import evidenceguard_agents.assembly as assembly
          import evidenceguard_agents.planner as planner
          import evidenceguard_agents.prompts as prompts
          import evidenceguard_agents.templates as templates
          from evidenceguard_domain.evidence import Authenticity, SourceType
          from evidenceguard_domain.model_calls import ModelPurpose, PromptRef
          from evidenceguard_domain.provenance import QuestionEvidence
          from evidenceguard_domain.retrieval import RETRIEVAL_CONFIG_V1, ChannelHit, ChunkEvidence, PendingExclusions, RetrievalResult, RetrievalSnapshot, RetrievedChunk, RevisionBinding, SourceSpan
          from evidenceguard_retrieval.embeddings import HASH_IDENTITY
          for module in (assembly, planner, prompts, templates):
              assert "site-packages" in (module.__file__ or ""), module.__name__
          data = files("evidenceguard_agents").joinpath("data")
          assert "site-packages" in str(data), str(data)
          template_sha = "26fcbe26dcc47f5991da5b741475c736cec27b1f2bd6ab515ec07ac59895786a"
          prompt_sha = "629f8f972a0f5d6247a54364da59f04d53a1a023472fa00830ebedfe106b007d"
          analyst_sha = "f8e485998dc2ff79c839100c27326a6e119135788060237a9fcbe5fed0051b29"
          template_bytes = data.joinpath("templates", "vendor_security_review_v1.toml").read_bytes()
          assert hashlib.sha256(template_bytes).hexdigest() == template_sha
          ref = templates.TemplateRef(template_id="vendor_security_review", version=1, sha256=template_sha)
          template = templates.load_pinned_template(ref)
          assert [q.question_id for q in template.questions] == ["RET-01", "ENC-01", "CMP-01", "CMP-02", "INC-01", "BCP-01", "SUB-01", "SOC-01"]
          planned = planner.plan_review(template)
          assert len(planned) == 8 and planned[1].retrieval.k == 8
          assert planned[1].retrieval.queries == ("customer data encryption at rest", "stored data encryption")
          spec, system_text = prompts.load_pinned_prompt(PromptRef(prompt_id="verifier", version=1, sha256=prompt_sha), ModelPurpose.VERIFIER)
          assert hashlib.sha256(system_text.encode("utf-8")).hexdigest() == prompt_sha
          prompts.load_pinned_prompt(PromptRef(prompt_id="risk_analyst", version=1, sha256=analyst_sha), ModelPurpose.RISK_ANALYST)
          tenant, rev, doc = uuid.UUID("11111111-1111-4111-8111-111111111111"), uuid.UUID("33333333-3333-4333-8333-333333333333"), uuid.UUID("44444444-4444-4444-8444-444444444444")
          binding = RevisionBinding(rev, doc, uuid.UUID("5b7601bd-c104-574b-afc4-8e43c3da8ecc"), "md-v1", 2, "a" * 64, "b" * 64)
          snapshot = RetrievalSnapshot(tenant_id=tenant, vendor_id=uuid.UUID("22222222-2222-4222-8222-222222222222"), identity=HASH_IDENTITY, config=RETRIEVAL_CONFIG_V1, bindings=(binding,), exclusions=PendingExclusions(0, (), False), captured_at=datetime(2026, 10, 17, 9, 30, tzinfo=UTC))
          body = "Customer data is encrypted at rest."
          chunk = ChunkEvidence(uuid.UUID(int=1), body, hashlib.sha256(body.encode()).hexdigest(), 0, ("Encryption",), False, SourceSpan(5, 6, 200, 200 + len(body)), None, "security-overview", "Security Overview", 1, None, None, SourceType.VENDOR_STATEMENT, Authenticity.NOT_ESTABLISHED)
          item = RetrievedChunk(chunk_id=uuid.UUID(int=1), revision_id=rev, document_id=doc, fused_rank=1, fused_score=Fraction(1, 61), hits=(ChannelHit(0, "lexical", 1, 1.0),), evidence=chunk)
          result = RetrievalResult(snapshot, 1, 8, (), (item,))
          evidence = QuestionEvidence(tenant_id=tenant, review_id=uuid.UUID(int=8), snapshot_sha256=result.snapshot_sha256, question=planned[1].question, result=result)
          inputs = assembly.VerifierRequestInputs(evidence=evidence, prompt=spec, system_text=system_text, settings=assembly.ModelSettings(model_id="fake-scripted-v1"))
          request = assembly.assemble_verifier_request(inputs)
          assert hashlib.sha256(request.user_text.encode("utf-8")).hexdigest() == "d9be2e48d1a403f0e5974f6f1be263198ea501c887579cff905dc1463cb748c6"
          assert request.request_sha256 == "59eaf2e372637cda70ff659c66e8d2a97d032ec323cd89d9f07b26aa35746580"
          print("review template, prompts and request assembly ran from the installed wheel")
          PY
          "${bin}/python" -I -c "import io; from alembic import command; from evidenceguard_persistence.migration_config import alembic_config; buf = io.StringIO(); command.upgrade(alembic_config(output_buffer=buf), 'head', sql=True); assert 'CREATE TABLE api_keys' in buf.getvalue(); print('offline migration SQL rendered from the installed wheel')"

  integration:
    # PostgreSQL integration tests. Service containers run only on Linux runners, so this job
    # is Ubuntu-only; the verify job keeps the database-independent checks on both systems.
    name: integration (ubuntu-24.04, PostgreSQL 17 + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          # Disposable credentials for this throwaway CI container only.
          POSTGRES_USER: evidenceguard
          POSTGRES_PASSWORD: evidenceguard-ci-only
          POSTGRES_DB: evidenceguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceguard -d evidenceguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EG_TEST_DATABASE_URL: postgresql+psycopg://evidenceguard:evidenceguard-ci-only@localhost:5432/evidenceguard_test
      EG_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Confirm the database is ready
        run: docker exec "${{ job.services.postgres.id }}" pg_isready -U evidenceguard -d evidenceguard_test

      - name: Run integration tests
        run: uv run --locked pytest -m integration

  container:
    # M3f (ADR-0012): image build, effective build-context check, image checks and a Compose smoke
    # test. Linux containers need an Ubuntu runner. Development stack only; nothing is published.
    name: container (ubuntu-24.04, image build and Compose smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # One selection for every step: the same Compose file, project name and image tag.
      EG_COMPOSE_PROJECT: eg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      EG_IMAGE: evidenceguard:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the rendered Compose configuration
        run: python3 infra/ci/container_ci.py config

      - name: Verify the effective build context
        run: python3 infra/ci/container_ci.py context

      - name: Build the application image
        run: |
          set -euo pipefail
          timeout 900 docker compose -f docker-compose.yml -p "$EG_COMPOSE_PROJECT" build api
          echo "EG_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$EG_IMAGE")" >> "$GITHUB_ENV"

      - name: Check the image
        run: python3 infra/ci/container_ci.py image

      - name: Compose smoke test
        run: python3 infra/ci/container_ci.py smoke

      - name: Clean up this run's Compose project and image
        # Runs whatever the outcome. Losing the runner or a hard cancellation can still prevent it.
        if: always()
        run: python3 infra/ci/container_ci.py cleanup
